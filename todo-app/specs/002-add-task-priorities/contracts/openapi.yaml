openapi: 3.1.0
info:
  title: Todo API
  version: 1.1.0
  description: API for creating, listing, filtering, updating, and deleting todos.
servers:
  - url: http://localhost:8080
paths:
  /api/todos:
    get:
      summary: List todos
      description: >-
        Returns todos in creation order. The optional status and priority filters
        are combined: a todo must match both specific filters. An omitted or all
        filter does not restrict results.
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [all, open, completed]
            default: all
        - name: priority
          in: query
          required: false
          schema:
            type: string
            enum: [all, low, medium, high]
            default: all
      responses:
        "200":
          description: Todo list; an empty match is returned as an empty array.
          content:
            application/json:
              schema:
                type: object
                required: [todos]
                properties:
                  todos:
                    type: array
                    items:
                      $ref: "#/components/schemas/Todo"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/ServerError"
    post:
      summary: Create a todo
      description: >-
        Priority is optional for backward compatibility. If omitted, the new
        todo receives priority medium.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              additionalProperties: false
              properties:
                title:
                  type: string
                  minLength: 1
                  description: >-
                    Leading and trailing characters in the Unicode White_Space
                    property are removed. The normalized value must contain at
                    least one character outside that property.
                priority:
                  $ref: "#/components/schemas/TodoPriority"
      responses:
        "201":
          description: Created todo, with effective priority included.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Todo"
        "400":
          $ref: "#/components/responses/BadRequest"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "500":
          $ref: "#/components/responses/ServerError"
  /api/todos/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
          minimum: 1
    patch:
      summary: Update a todo
      description: >-
        Supply status, priority, or both. At least one must be supplied. An
        omitted field is unchanged; status-only requests remain compatible with
        existing clients. A todo without a legacy priority has effective priority
        medium.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              additionalProperties: false
              properties:
                status:
                  $ref: "#/components/schemas/TodoStatus"
                priority:
                  $ref: "#/components/schemas/TodoPriority"
      responses:
        "200":
          description: Updated todo, including its effective priority.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Todo"
        "400":
          $ref: "#/components/responses/BadRequest"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
    delete:
      summary: Delete a todo
      description: Deletes the todo immediately without confirmation; deletion cannot be undone.
      responses:
        "204":
          description: Todo deleted; response has no body.
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
components:
  schemas:
    TodoStatus:
      type: string
      enum: [open, completed]
    TodoPriority:
      type: string
      enum: [low, medium, high]
    Todo:
      type: object
      required: [id, title, status, priority]
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        title:
          type: string
          minLength: 1
        status:
          $ref: "#/components/schemas/TodoStatus"
        priority:
          allOf:
            - $ref: "#/components/schemas/TodoPriority"
          description: >-
            Effective todo priority. Missing legacy values are treated as medium.
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          minLength: 1
          description: A non-empty message describing why the request failed.
  responses:
    BadRequest:
      description: Invalid request or unsupported filter/status/priority value.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: No todo exists with the requested ID.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    PayloadTooLarge:
      description: Request body exceeds the 1 MiB transport limit.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ServerError:
      description: Unexpected server-side failure.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
