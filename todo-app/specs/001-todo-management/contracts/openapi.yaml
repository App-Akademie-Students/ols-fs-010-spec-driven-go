openapi: 3.1.0
info:
  title: Todo API
  version: 1.0.0
  description: API for creating, listing, filtering, updating status, and deleting todos.
servers:
  - url: http://localhost:8080
paths:
  /api/todos:
    get:
      summary: List todos
      description: >-
        Returns all todos or filters them by status. An omitted status means all.
        Results are returned in creation order; filtering preserves that order.
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [all, open, completed]
            default: all
      responses:
        "200":
          description: Todo list
          content:
            application/json:
              schema:
                type: object
                required: [todos]
                properties:
                  todos:
                    type: array
                    items:
                      $ref: "#/components/schemas/Todo"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/ServerError"
    post:
      summary: Create a todo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              additionalProperties: false
              properties:
                title:
                  type: string
                  minLength: 1
                  description: >-
                    Leading and trailing characters in the Unicode White_Space
                    property are removed and the normalized value is stored.
                    The result must contain at least one character outside that
                    property. No product-level maximum length or character
                    restriction applies.
      responses:
        "201":
          description: Created todo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Todo"
        "400":
          $ref: "#/components/responses/BadRequest"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "500":
          $ref: "#/components/responses/ServerError"
  /api/todos/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
          minimum: 1
    patch:
      summary: Change a todo status
      description: Status can change between open and completed in either direction. A missing todo returns 404.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              additionalProperties: false
              properties:
                status:
                  $ref: "#/components/schemas/TodoStatus"
      responses:
        "200":
          description: Updated todo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Todo"
        "400":
          $ref: "#/components/responses/BadRequest"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
    delete:
      summary: Delete a todo
      description: Deletes the todo immediately without confirmation; deletion cannot be undone.
      responses:
        "204":
          description: Todo deleted; response has no body.
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"
components:
  schemas:
    TodoStatus:
      type: string
      enum: [open, completed]
    Todo:
      type: object
      required: [id, title, status]
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        title:
          type: string
          minLength: 1
        status:
          $ref: "#/components/schemas/TodoStatus"
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          minLength: 1
          description: A non-empty message describing why the request failed.
  responses:
    BadRequest:
      description: Invalid request or unsupported filter/status value.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: No todo exists with the requested ID.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    PayloadTooLarge:
      description: Request body exceeds the 1 MiB transport limit.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ServerError:
      description: Unexpected server-side failure.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
